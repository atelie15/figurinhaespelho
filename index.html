<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M19B35V7NY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-M19B35V7NY');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figurinha + GIF para WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6F0;
    --ink:#201C16;
    --whats:#1FA463;
    --pop:#E8532F;
    --gold:#E8A33D;
    --line:rgba(32,28,22,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(32,28,22,0.06) 1px, transparent 1px) 0 0/18px 18px,
      var(--paper);
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:460px;margin:0 auto;padding:28px 16px 40px;text-align:center;}

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--whats);
    display:inline-block;
    border:1.5px dashed var(--whats);
    padding:4px 12px;border-radius:100px;margin-bottom:14px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;font-weight:800;
    font-size:clamp(28px,7vw,40px);line-height:1.05;
    margin:0 0 20px;transform:rotate(-1deg);
  }
  h1 span{
    background:linear-gradient(90deg, var(--pop), var(--gold));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:24px;
    padding:16px;
    box-shadow:0 18px 40px -24px rgba(32,28,22,0.35);
  }
  .preview{
    width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    background:#f3efe8;
  }
  .preview img{width:100%;height:100%;object-fit:cover;display:block;}

  .includes{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    margin:16px 0 4px;
  }
  .chip{
    font-family:'Baloo 2', sans-serif;font-weight:700;font-size:14px;
    background:rgba(31,164,99,0.1);color:#157a48;
    padding:6px 14px;border-radius:100px;
  }

  .price{
    font-family:'Baloo 2', sans-serif;font-weight:800;
    font-size:44px;line-height:1;margin:18px 0 4px;
  }
  .price small{font-size:20px;font-weight:700;margin-right:4px;}
  .price-note{font-size:13.5px;color:rgba(32,28,22,0.6);margin:0 0 18px;}

  .buy{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;
    background:linear-gradient(135deg, var(--whats), #178250);
    color:#fff;text-decoration:none;
    font-family:'Baloo 2', sans-serif;font-weight:800;font-size:19px;
    padding:15px 20px;border-radius:100px;
    box-shadow:0 12px 24px -12px rgba(31,164,99,0.8);
    transition:transform .15s ease;
  }
  .buy:hover{transform:translateY(-2px);}
  .buy svg{width:22px;height:22px;fill:currentColor;}

  .steps{text-align:left;margin:24px 0 0;padding:0;list-style:none;display:grid;gap:10px;}
  .steps li{
    display:flex;gap:12px;align-items:center;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:12px 14px;font-size:14px;line-height:1.4;
  }
  .steps b.n{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:var(--whats);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2', sans-serif;font-size:14px;
  }

  .site-footer{
    text-align:center;font-size:13px;color:rgba(38,34,28,0.6);
    margin:28px 0 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Para WhatsApp</div>

  <div class="card">
    <div class="preview">
      <img src="images/040.gif" alt="Prévia animada da figurinha">
    </div>

    <div class="includes">
      <span class="chip">✔ Figurinha</span>
      <span class="chip">✔ GIF animado</span>
    </div>

    <div class="price"><small>R$</small>5,13</div>
    <p class="price-note">Pagamento único · você recebe os dois arquivos</p>

    <a class="buy" id="buyBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>
      Comprar pelo WhatsApp
    </a>
  </div>

  <ul class="steps">
    <li><b class="n">1</b><span>Toque em <b>Comprar pelo WhatsApp</b>.</span></li>
    <li><b class="n">2</b><span>Envie a mensagem e faça o pagamento de R$&nbsp;5,13.</span></li>
    <li><b class="n">3</b><span>Receba a figurinha e o GIF direto no seu WhatsApp.</span></li>
  </ul>

  <p class="site-footer">CNPJ: 23.599.519/0001-33</p>
</div>

<script>
/* TROQUE AQUI se precisar: número do WhatsApp e preço */
const WHATSAPP_NUMBER = "557791701194";
const PRICE = "5,13";
const MSG = `Olá! Quero comprar a figurinha + GIF por R$ ${PRICE}.`;

const btn = document.getElementById("buyBtn");
btn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(MSG)}`;
btn.addEventListener("click", () => {
  if (window.gtag) gtag('event', 'clique_comprar', { value: 5.13, currency: 'BRL' });
});
</script>
</body>
</html>
